name: ClaudeSessionManager
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    OTHER_LDFLAGS: ["-lsqlite3"]
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "NO"
schemes:
  ClaudeSessionManager:
    build:
      targets:
        ClaudeSessionManager: all
        ClaudeSessionManagerTests: [test]
    test:
      targets:
        - ClaudeSessionManagerTests
targets:
  ClaudeSessionManager:
    type: application
    platform: macOS
    sources:
      - path: ClaudeSessionManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.ClaudeSessionManager
        PRODUCT_NAME: 会话管家
        INFOPLIST_FILE: ClaudeSessionManager/Info.plist
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: true
        ENABLE_HARDENED_RUNTIME: true
        DEAD_CODE_STRIPPING: true
        SWIFT_EMIT_LOC_STRINGS: false
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "5"
        CODE_SIGN_ENTITLEMENTS: ClaudeSessionManager/ClaudeSessionManager.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ClaudeSessionManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClaudeSessionManagerTests
    dependencies:
      - target: ClaudeSessionManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.ClaudeSessionManagerTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/会话管家.app/Contents/MacOS/会话管家"
        BUNDLE_LOADER: "$(TEST_HOST)"
